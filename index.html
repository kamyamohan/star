<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shooting Wishes</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#aee3ff;--lav:#c8b6ff}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Manrope',sans-serif;background:#03061a;color:#fff}

/* ── CANVAS ── */
#sky{position:fixed;inset:0;z-index:0}

/* ── VIGNETTE ── */
#vig{
  position:fixed;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%,transparent 22%,rgba(2,4,18,.28) 62%,rgba(1,2,12,.72) 100%)
}

/* ── VIEWS ── */
.view{
  position:fixed;inset:0;z-index:10;
  opacity:0;pointer-events:none;
  transition:opacity .9s cubic-bezier(.4,0,.2,1)
}
.view.on{opacity:1;pointer-events:all}

/* ── LANDING ── */
#land{display:flex;flex-direction:column;align-items:center;justify-content:center}

#prompt{
  font-size:clamp(1.25rem,3vw,2rem);font-weight:200;font-style:italic;
  letter-spacing:.12em;color:rgba(255,255,255,.65);
  opacity:0;transform:translateY(10px);
  transition:opacity 1.6s ease,transform 1.6s ease;
  margin-bottom:3.2rem;text-align:center;user-select:none
}
#prompt.up{opacity:1;transform:translateY(0)}

#inp-wrap{
  display:flex;flex-direction:column;align-items:center;
  width:min(88vw,480px);
  opacity:0;transform:translateY(14px);
  transition:opacity 1.4s ease,transform 1.4s ease
}
#inp-wrap.up{opacity:1;transform:translateY(0)}

#wInput{
  width:100%;background:transparent;border:none;
  border-bottom:1px solid rgba(255,255,255,.08);
  padding:.7rem 0;
  font-family:'Manrope',sans-serif;font-weight:300;
  font-size:clamp(.95rem,2.5vw,1.22rem);
  color:#fff;outline:none;text-align:center;
  letter-spacing:.06em;caret-color:var(--blue);
  transition:border-color .5s ease,text-shadow .4s ease
}
#wInput::placeholder{color:rgba(255,255,255,.16);font-style:italic;font-weight:200}
#wInput:focus{border-bottom-color:rgba(174,227,255,.25)}

@keyframes inputShake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)}
  80%{transform:translateX(4px)}
}
#wInput.shake{animation:inputShake .32s ease}

#wHint{
  margin-top:.65rem;font-size:.67rem;font-weight:200;
  color:rgba(174,227,255,.38);letter-spacing:.16em;font-style:italic;
  opacity:0;transition:opacity .8s ease;min-height:1em
}
#wHint.on{opacity:1}

#wCount{
  margin-top:.4rem;font-size:.58rem;font-weight:200;
  color:rgba(255,255,255,.1);letter-spacing:.1em;min-height:.9em;
  transition:color .4s
}
#wCount.warn{color:rgba(200,182,255,.42)}

#shoot-wrap{
  margin-top:3rem;opacity:0;transition:opacity .9s ease;
  display:flex;flex-direction:column;align-items:center
}
#shoot-wrap.up{opacity:1}

#shootBtn{
  background:transparent;border:none;
  color:rgba(255,255,255,.36);
  font-family:'Manrope',sans-serif;font-weight:200;
  font-size:.7rem;letter-spacing:.26em;text-transform:uppercase;
  cursor:pointer;padding:.5rem 1rem;
  transition:color .35s,text-shadow .35s,letter-spacing .35s
}
#shootBtn:hover{
  color:rgba(174,227,255,.88);letter-spacing:.3em;
  text-shadow:0 0 22px rgba(174,227,255,.4)
}

/* ── GHOST ANIMATION ── */
#ghost{
  position:fixed;left:50%;
  font-family:'Manrope',sans-serif;font-weight:300;
  font-size:clamp(.95rem,2.5vw,1.22rem);
  color:#fff;text-align:center;letter-spacing:.06em;
  pointer-events:none;z-index:250;
  opacity:0;transform:translateX(-50%);
  will-change:transform,opacity,filter
}
#ghost.fly{
  animation:wFly 1.6s cubic-bezier(.15,0,.7,1) forwards
}
@keyframes wFly{
  0%  {opacity:1;filter:blur(0);
       transform:translateX(-50%) translateY(0) scale(1);
       text-shadow:0 0 8px rgba(174,227,255,.3)}
  20% {opacity:.88;filter:blur(0);
       transform:translateX(-50%) translateY(-10vh) scale(1.03);
       text-shadow:0 0 30px rgba(174,227,255,.95),0 0 60px rgba(200,182,255,.55)}
  50% {opacity:.72;filter:blur(.4px);
       transform:translateX(-50%) translateY(-28vh) scale(.52);
       text-shadow:0 0 50px rgba(200,182,255,1),0 0 100px rgba(174,227,255,.6)}
  77% {opacity:.4;filter:blur(3px);
       transform:translateX(-50%) translateY(-43vh) scale(.16);
       text-shadow:0 0 80px rgba(255,255,255,1)}
  100%{opacity:0;filter:blur(14px);
       transform:translateX(-50%) translateY(-54vh) scale(.015)}
}

/* ── DIM + FLASH ── */
#dim{
  position:fixed;inset:0;z-index:199;pointer-events:none;
  background:rgba(0,0,8,.55);
  opacity:0;transition:opacity .4s ease
}
#dim.on{opacity:1}

#flash{
  position:fixed;inset:0;z-index:200;pointer-events:none;
  background:radial-gradient(ellipse at 50% 26%,
    rgba(200,182,255,.22) 0%,rgba(174,227,255,.07) 40%,transparent 70%);
  opacity:0
}
#flash.pop{animation:flashPop 2.2s ease forwards}
@keyframes flashPop{0%{opacity:0}10%{opacity:1}55%{opacity:.38}100%{opacity:0}}

/* ── FEEDBACK ── */
#feedback{
  position:fixed;bottom:5.2rem;left:50%;transform:translateX(-50%);
  font-size:.67rem;font-weight:200;letter-spacing:.16em;
  color:rgba(174,227,255,.48);font-style:italic;
  opacity:0;transition:opacity .5s ease;z-index:40;
  pointer-events:none;white-space:nowrap
}
#feedback.on{opacity:1}

/* ── CONTROLS ── */
#ctrl{
  position:fixed;bottom:1.9rem;left:50%;transform:translateX(-50%);
  z-index:50;display:flex;gap:2.5rem;align-items:center;
  opacity:0;pointer-events:none;transition:opacity .7s ease
}
#ctrl.up{opacity:1;pointer-events:all}

.cbtn{
  background:transparent;border:none;
  color:rgba(255,255,255,.18);
  font-family:'Manrope',sans-serif;font-weight:200;
  font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;
  cursor:pointer;padding:.4rem .5rem;
  transition:color .3s;
  display:flex;align-items:center;gap:.55rem
}
.cbtn:hover{color:rgba(255,255,255,.55)}
.cbtn.on{color:rgba(174,227,255,.62)}
.cdot{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.65}

/* ── SKY VIEW ── */
#skyHdr{
  position:fixed;top:0;left:0;right:0;
  padding:1.8rem 2rem;
  background:linear-gradient(to bottom,rgba(3,6,26,.65) 0%,transparent 100%);
  z-index:25;pointer-events:none;
  display:flex;align-items:baseline;gap:1rem
}
#skyTitle{
  font-size:1rem;font-weight:200;font-style:italic;
  letter-spacing:.09em;color:rgba(255,255,255,.42)
}
#skyN{
  font-size:.57rem;font-weight:200;letter-spacing:.15em;
  text-transform:uppercase;color:rgba(174,227,255,.25);
  margin-left:auto
}

#wishBox{position:fixed;inset:0;overflow:hidden}

/* Floating wish nodes */
.wn{
  position:absolute;cursor:pointer;
  transform:translate(-50%,-50%);
  z-index:15;user-select:none
}
.wt{
  font-family:'Manrope',sans-serif;font-weight:200;
  letter-spacing:.04em;line-height:1.65;text-align:center;
  color:#fff;max-width:175px;
  transition:opacity .55s ease,text-shadow .55s ease,
             transform .5s cubic-bezier(.34,1.56,.64,1)
}
.wa{
  display:block;font-size:.57rem;letter-spacing:.12em;
  color:rgba(174,227,255,.35);margin-top:.42rem;
  opacity:0;transition:opacity .4s ease;
  font-style:italic;text-align:center
}
.wn:hover .wt{
  opacity:1!important;
  transform:scale(1.07)!important;
  text-shadow:0 0 24px rgba(200,182,255,.8),0 0 50px rgba(174,227,255,.35)
}
.wn:hover .wa{opacity:1}

@keyframes dA{0%,100%{transform:translate(0,0)}33%{transform:translate(-8px,-14px)}66%{transform:translate(7px,-9px)}}
@keyframes dB{0%,100%{transform:translate(0,0)}33%{transform:translate(11px,-10px)}66%{transform:translate(-7px,-16px)}}
@keyframes dC{0%,100%{transform:translate(0,0)}33%{transform:translate(-7px,-18px)}66%{transform:translate(12px,-6px)}}
@keyframes dD{0%,100%{transform:translate(0,0)}33%{transform:translate(9px,-12px)}66%{transform:translate(-10px,-8px)}}
.da{animation:dA 15s ease-in-out infinite}
.db{animation:dB 12s ease-in-out infinite}
.dc{animation:dC 17s ease-in-out infinite}
.dd{animation:dD 13s ease-in-out infinite}

@keyframes nodeIn{
  from{opacity:0;transform:translate(-50%,-50%) scale(.88)}
  to{transform:translate(-50%,-50%) scale(1)}
}

#emptySky{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-size:.9rem;font-weight:200;font-style:italic;
  color:rgba(255,255,255,.12);letter-spacing:.08em;
  pointer-events:none;display:none;text-align:center
}

/* ── LOADER ── */
#loader{
  position:fixed;inset:0;z-index:9999;
  background:#03061a;
  display:flex;align-items:center;justify-content:center;
  transition:opacity 1s ease
}
#loader.out{opacity:0;pointer-events:none}
.ldot{
  width:5px;height:5px;border-radius:50%;
  background:rgba(174,227,255,.4);
  animation:lp 1.4s ease-in-out infinite
}
@keyframes lp{0%,100%{transform:scale(.7);opacity:.2}50%{transform:scale(1.5);opacity:1}}

@media(max-width:480px){
  .wt{font-size:.72rem!important;max-width:128px}
  #ctrl{gap:1.6rem;bottom:1.3rem}
  .cbtn{font-size:.57rem}
}
</style>
</head>
<body>

<div id="loader"><div class="ldot"></div></div>
<canvas id="sky"></canvas>
<div id="vig"></div>
<div id="dim"></div>
<div id="flash"></div>
<div id="ghost"></div>
<div id="feedback"></div>

<!-- LANDING VIEW -->
<div id="land" class="view">
  <div id="prompt">Make a wish&hellip;</div>
  <div id="inp-wrap">
    <input id="wInput" type="text"
      placeholder="What do you wish for?"
      maxlength="100" autocomplete="off" spellcheck="false">
    <div id="wHint">Keep it light, let it fly&hellip;</div>
    <div id="wCount"></div>
  </div>
  <div id="shoot-wrap">
    <button id="shootBtn">release into the sky &nbsp;&#10022;</button>
  </div>
</div>

<!-- SKY OF WISHES VIEW -->
<div id="skyV" class="view">
  <div id="skyHdr">
    <span id="skyTitle">Sky of Wishes</span>
    <span id="skyN"></span>
  </div>
  <div id="wishBox">
    <p id="emptySky">The sky is empty.<br>Be the first to make a wish.</p>
  </div>
</div>

<!-- PERSISTENT CONTROLS -->
<div id="ctrl">
  <button class="cbtn on" id="wBtn"><span class="cdot"></span>Make a wish</button>
  <button class="cbtn"    id="exBtn"><span class="cdot"></span>Explore sky</button>
</div>

<script>
'use strict';

// =====================================================
// CANVAS ENGINE
// =====================================================
const cv  = document.getElementById('sky');
const ctx = cv.getContext('2d');
let W, H;

const resize = () => {
  W = cv.width  = window.innerWidth;
  H = cv.height = window.innerHeight;
  buildStars();
};
window.addEventListener('resize', resize);

// Color palette [r,g,b]
const PAL = [
  [255, 255, 255],   // white
  [174, 227, 255],   // soft blue
  [200, 182, 255],   // lavender
  [220, 235, 255],   // cool white
  [240, 232, 255],   // pale lilac
];

// ── Static star field ──────────────────────────────
let stars = [];
const buildStars = () => {
  stars = [];
  const n = Math.min(Math.floor(W * H / 4600), 300);
  for (let i = 0; i < n; i++) {
    const w = Math.random();
    stars.push({
      x:   Math.random() * W,
      y:   Math.random() * H,
      r:   Math.random() ** 2.4 * 1.85 + 0.1,
      base:Math.random() * 0.5  + 0.1,
      ts:  Math.random() * 0.011 + 0.003,
      tp:  Math.random() * Math.PI * 2,
      ta:  Math.random() * 0.26  + 0.07,
      lay: Math.random(),          // parallax depth: 0=far,1=near
      ci:  w > .55 ? 0 : w > .38 ? 1 : w > .24 ? 2 : 3,
    });
  }
};

// ── Cursor parallax ───────────────────────────────
let tPX = 0, tPY = 0, cPX = 0, cPY = 0;
document.addEventListener('mousemove', e => {
  tPX = (e.clientX / W - 0.5) * 15;
  tPY = (e.clientY / H - 0.5) * 10;
}, { passive: true });

// ── Shooting stars ────────────────────────────────
let shooters = [];
let nextAmb  = 0;

const spawnShooter = (opts = {}) => {
  const iw  = opts.isWish || false;
  const ci  = Math.floor(Math.random() * PAL.length);
  const x   = opts.x  ?? (Math.random() * W * 0.75 + W * 0.1);
  const y   = opts.y  ?? (Math.random() * H * 0.48);
  const ang = (10 + Math.random() * 52) * Math.PI / 180;
  const sgn = Math.random() > 0.32 ? 1 : -1;
  const spd = iw ? 10 + Math.random() * 10 : 4 + Math.random() * 5;
  shooters.push({
    x, y,
    vx: Math.cos(ang) * spd * sgn,
    vy: Math.sin(ang) * spd,
    trail: [], tMax: iw ? 42 : 26,
    ci, life: 0, mL: iw ? 108 : 78,
    gr: iw ? 18 : 9, hr: iw ? 2.8 : 1.7, iw,
  });
};

const spawnBurst = () => {
  const n = 7 + Math.floor(Math.random() * 4);
  for (let i = 0; i < n; i++)
    setTimeout(() => spawnShooter({ isWish: true }), i * 88 + Math.random() * 50);
};

// ── Typing particles ──────────────────────────────
let tParts  = [];
let lastTPT = 0;

const spawnTP = () => {
  const el = document.getElementById('wInput');
  if (!el) return;
  const r = el.getBoundingClientRect();
  for (let i = 0; i < 3; i++) {
    const ci = Math.random() < .45 ? 0 : Math.random() < .5 ? 1 : 2;
    tParts.push({
      x:  r.left + r.width * .5 + (Math.random() - .5) * r.width * .65,
      y:  r.top + (Math.random() - .5) * 10,
      vx: (Math.random() - .5) * 1.5,
      vy: -(0.65 + Math.random() * 1.4),
      r:  0.8 + Math.random() * 1.5,
      life: 0, mL: 44 + Math.floor(Math.random() * 28), ci,
    });
  }
};

// ── Main render loop ──────────────────────────────
let rafT = 0;

const animate = now => {
  requestAnimationFrame(animate);
  rafT = now * 0.001;

  // Lerp parallax
  cPX += (tPX - cPX) * 0.042;
  cPY += (tPY - cPY) * 0.042;

  ctx.clearRect(0, 0, W, H);

  // Deep gradient sky (navy → deep purple)
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0,    '#03061a');
  bg.addColorStop(0.28, '#06092a');
  bg.addColorStop(0.58, '#0c0720');
  bg.addColorStop(1,    '#170a30');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // Pulsating horizon glow
  const p1 = Math.sin(rafT * 0.27) * 0.038 + 0.082;
  const h1 = ctx.createRadialGradient(W*.5, H*.8, 0, W*.5, H*.8, H*.58);
  h1.addColorStop(0,   `rgba(72,42,148,${p1})`);
  h1.addColorStop(.5,  `rgba(42,24,96,${p1*.38})`);
  h1.addColorStop(1,   'transparent');
  ctx.fillStyle = h1; ctx.fillRect(0, 0, W, H);

  const p2 = Math.sin(rafT * 0.18 + 1.7) * 0.022 + 0.038;
  const h2 = ctx.createRadialGradient(W*.3, H*.84, 0, W*.3, H*.84, H*.44);
  h2.addColorStop(0,   `rgba(50,32,128,${p2})`);
  h2.addColorStop(1,   'transparent');
  ctx.fillStyle = h2; ctx.fillRect(0, 0, W, H);

  // Twinkling stars with parallax
  for (const s of stars) {
    const a = Math.max(.02, Math.min(1,
      s.base + Math.sin(rafT * s.ts * 60 + s.tp) * s.ta
    ));
    const c = PAL[s.ci];
    ctx.beginPath();
    ctx.arc(s.x + cPX * s.lay, s.y + cPY * s.lay, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${a})`;
    ctx.fill();
  }

  // Ambient shooter every 10–18s
  if (now > nextAmb) {
    spawnShooter();
    nextAmb = now + 10000 + Math.random() * 8500;
  }

  // Draw & update shooters
  for (let i = shooters.length - 1; i >= 0; i--) {
    const s = shooters[i];
    s.trail.push({ x: s.x, y: s.y });
    if (s.trail.length > s.tMax) s.trail.shift();
    s.x += s.vx; s.y += s.vy; s.life++;
    if (s.life > s.mL || s.x < -320 || s.x > W + 320 || s.y > H + 100) {
      shooters.splice(i, 1); continue;
    }
    if (s.trail.length < 2) continue;

    const lr = s.life / s.mL;
    const a  = lr < .12 ? lr / .12 : lr > .7 ? 1 - (lr - .7) / .3 : 1;
    const c  = PAL[s.ci];

    // Fading trail
    for (let j = 1; j < s.trail.length; j++) {
      const t0 = s.trail[j - 1], t1 = s.trail[j];
      ctx.beginPath(); ctx.moveTo(t0.x, t0.y); ctx.lineTo(t1.x, t1.y);
      ctx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},${(j / s.trail.length) * a * .78})`;
      ctx.lineWidth   = (j / s.trail.length) * s.hr * .9;
      ctx.lineCap     = 'round'; ctx.stroke();
    }

    // Glow head
    const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.gr * 2.6);
    g.addColorStop(0,   `rgba(${c[0]},${c[1]},${c[2]},${a * .92})`);
    g.addColorStop(.4,  `rgba(${c[0]},${c[1]},${c[2]},${a * .3})`);
    g.addColorStop(1,   `rgba(${c[0]},${c[1]},${c[2]},0)`);
    ctx.beginPath(); ctx.arc(s.x, s.y, s.gr * 2.6, 0, Math.PI * 2);
    ctx.fillStyle = g; ctx.fill();

    ctx.beginPath(); ctx.arc(s.x, s.y, s.hr, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${a})`; ctx.fill();
  }

  // Typing particles
  for (let i = tParts.length - 1; i >= 0; i--) {
    const p = tParts[i];
    const a = (1 - p.life / p.mL) * .84;
    const c = PAL[p.ci];
    ctx.beginPath();
    ctx.arc(
      p.x + p.vx * p.life,
      p.y + p.vy * p.life,
      p.r * (1 - p.life / p.mL * .4),
      0, Math.PI * 2
    );
    ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${a})`; ctx.fill();
    p.life++;
    if (p.life >= p.mL) tParts.splice(i, 1);
  }
};
requestAnimationFrame(animate);

// =====================================================
// ENTRY SEQUENCE — staggered, soft reveal
// =====================================================
const wInput   = document.getElementById('wInput');
const promptEl = document.getElementById('prompt');
const inpWrap  = document.getElementById('inp-wrap');
const shootWrp = document.getElementById('shoot-wrap');
const ctrlDiv  = document.getElementById('ctrl');

const entry = () => {
  setTimeout(() => promptEl.classList.add('up'),    900);
  setTimeout(() => inpWrap.classList.add('up'),    1800);
  setTimeout(() => {
    shootWrp.classList.add('up');
    wInput.focus();
  }, 2550);
  setTimeout(() => ctrlDiv.classList.add('up'), 3100);
};

// =====================================================
// INPUT — glow, particles, hints
// =====================================================
const wHint  = document.getElementById('wHint');
const wCount = document.getElementById('wCount');

wInput.addEventListener('input', () => {
  const len = wInput.value.length;
  wCount.textContent = len > 62 ? `${100 - len} left` : '';
  wCount.classList.toggle('warn', len > 83);
  wHint.classList.toggle('on', len >= 96);

  if (len > 0) {
    const t  = Math.min(len / 72, 1);
    const gS = 6 + t * 34;
    const gA = 0.06 + t * 0.24;
    wInput.style.textShadow =
      `0 0 ${gS}px rgba(174,227,255,${gA}),` +
      `0 0 ${gS * 1.9}px rgba(200,182,255,${gA * .45})`;
    const now = Date.now();
    if (now - lastTPT > 55) { spawnTP(); lastTPT = now; }
  } else {
    wInput.style.textShadow = '';
  }
});

// =====================================================
// SHOOT SEQUENCE
// =====================================================
const ghost      = document.getElementById('ghost');
const flashEl    = document.getElementById('flash');
const dimEl      = document.getElementById('dim');
const feedbackEl = document.getElementById('feedback');
let   lastShot   = 0;
const COOL       = 12000;

const showFB = (msg, ms = 3800) => {
  feedbackEl.textContent = msg;
  feedbackEl.classList.add('on');
  setTimeout(() => feedbackEl.classList.remove('on'), ms);
};

const handleShoot = async () => {
  const txt = wInput.value.trim();
  if (!txt) {
    wInput.classList.remove('shake');
    void wInput.offsetWidth;
    wInput.classList.add('shake');
    setTimeout(() => wInput.classList.remove('shake'), 350);
    return;
  }

  const now = Date.now();
  if (now - lastShot < COOL) {
    showFB(`Wait ${Math.ceil((COOL - (now - lastShot)) / 1000)}s before your next wish`);
    return;
  }
  lastShot = now;
  const saved = txt;

  // Clear input immediately
  wInput.value = '';
  wInput.style.textShadow = '';
  wCount.textContent = '';
  wHint.classList.remove('on');

  // 1 — Position ghost exactly over input
  const rect = wInput.getBoundingClientRect();
  ghost.textContent = saved;
  ghost.style.top   = rect.top + 'px';
  ghost.classList.remove('fly');
  void ghost.offsetWidth;
  ghost.classList.add('fly');

  // 2 — Dim
  dimEl.classList.add('on');

  // 3 — Flash + burst at ~65% into animation
  setTimeout(() => {
    flashEl.classList.remove('pop');
    void flashEl.offsetWidth;
    flashEl.classList.add('pop');
    spawnBurst();
  }, 1050);

  // 4 — Lift dim
  setTimeout(() => dimEl.classList.remove('on'), 1250);

  // 5 — Clean ghost
  setTimeout(() => {
    ghost.classList.remove('fly');
    ghost.textContent = '';
  }, 1700);

  showFB('Your wish is flying through the universe\u2026', 4500);
  await saveWish(saved);
};

document.getElementById('shootBtn').addEventListener('click', handleShoot);
wInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleShoot(); });

// =====================================================
// STORAGE (shared via window.storage, in-memory fallback)
// =====================================================
const PFX = 'sw3:w:';
const MEM = {};

const saveWish = async text => {
  const id  = Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  const ci  = Math.floor(Math.random() * PAL.length);
  const val = JSON.stringify({ text: text.trim(), id, ts: Date.now(), ci });
  try   { await window.storage.set(PFX + id, val, true); }
  catch { MEM[PFX + id] = val; }
};

const loadWishes = async () => {
  const ws = [];
  try {
    const res = await window.storage.list(PFX, true);
    if (!res?.keys?.length) return ws;
    for (const k of res.keys) {
      try {
        const r = await window.storage.get(k, true);
        if (r?.value) ws.push(JSON.parse(r.value));
      } catch {}
    }
  } catch {
    for (const k of Object.keys(MEM))
      try { ws.push(JSON.parse(MEM[k])); } catch {}
  }
  return ws.sort((a, b) => b.ts - a.ts);
};

// =====================================================
// ANONYMIZATION — poetic, not social-media-like
// =====================================================
const ALIASES = [
  'Someone', 'A stranger', 'A dreamer', 'A wanderer',
  'A soul', 'A heart somewhere', 'Someone out there', 'A voice in the dark',
];
const anon = ts => {
  const d  = Date.now() - ts;
  const m  = Math.floor(d / 60000);
  const h  = Math.floor(m / 60);
  const dy = Math.floor(h / 24);
  const n  = ALIASES[Math.floor(Math.random() * ALIASES.length)];
  if (dy > 0)  return `${n}, ${dy}d ago`;
  if (h  > 0)  return `${n}, ${h}h ago`;
  if (m  > 1)  return `${n}, ${m}m ago`;
  if (m === 1) return `${n}, a minute ago`;
  return `${n}, just now`;
};

// =====================================================
// SKY OF WISHES
// =====================================================
const DRIFTS = ['da', 'db', 'dc', 'dd'];

const genPositions = count => {
  const pos = [];
  const MD  = 145;
  for (let i = 0; i < count; i++) {
    let x, y, ok = false, att = 0;
    while (!ok && att < 22) {
      x = 7  + Math.random() * 86;
      y = 17 + Math.random() * 73;
      ok = true;
      for (const p of pos) {
        const dx = (x - p.x) * W / 100;
        const dy = (y - p.y) * H / 100;
        if (Math.sqrt(dx * dx + dy * dy) < MD) { ok = false; break; }
      }
      att++;
    }
    pos.push({ x, y });
  }
  return pos;
};

let skyNodes = [];

const buildSky = async () => {
  const box   = document.getElementById('wishBox');
  const empty = document.getElementById('emptySky');
  box.querySelectorAll('.wn').forEach(n => n.remove());
  skyNodes = [];

  const wishes = await loadWishes();
  document.getElementById('skyN').textContent =
    wishes.length ? `${wishes.length} wish${wishes.length > 1 ? 'es' : ''}` : '';

  if (!wishes.length) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  const pos = genPositions(wishes.length);

  wishes.forEach((w, i) => {
    const delay  = (0.06 + i * 0.055).toFixed(2);
    const age    = Date.now() - w.ts;
    // Fresh wishes brighter; older ones fade but never disappear
    const baseOp = age < 300000 ? 0.38 : age < 3600000 ? 0.26 : age < 86400000 ? 0.2 : 0.14;
    const fs     = w.text.length < 22 ? '0.92rem' : w.text.length < 52 ? '0.82rem' : '0.73rem';

    const node = document.createElement('div');
    node.className = `wn ${DRIFTS[i % 4]}`;
    node.style.cssText = [
      `left:${pos[i].x}%`,
      `top:${pos[i].y}%`,
      `animation-delay:${(Math.random() * 7).toFixed(1)}s`,
      `animation:nodeIn 1s ease ${delay}s forwards`,
      `opacity:0`,
    ].join(';');

    const tw = document.createElement('div');
    tw.className       = 'wt';
    tw.style.opacity   = baseOp;
    tw.style.fontSize  = fs;
    tw.textContent     = `\u201c${w.text}\u201d`;

    const wa = document.createElement('span');
    wa.className   = 'wa';
    wa.textContent = anon(w.ts);

    tw.appendChild(wa);
    node.appendChild(tw);
    box.appendChild(node);

    // Click shoots from that position
    node.addEventListener('click', () => {
      const r = node.getBoundingClientRect();
      spawnShooter({ isWish: true, x: r.left + r.width * .5, y: r.top + r.height * .4 });
    });

    skyNodes.push(node);
  });

  // Random wish fires as shooting star periodically
  const randShoot = () => {
    if (!document.getElementById('skyV').classList.contains('on')) return;
    if (skyNodes.length) {
      const n = skyNodes[Math.floor(Math.random() * skyNodes.length)];
      const r = n.getBoundingClientRect();
      spawnShooter({ isWish: true, x: r.left + r.width * .5, y: r.top + r.height * .35 });
    }
    setTimeout(randShoot, 5500 + Math.random() * 9500);
  };
  setTimeout(randShoot, 3800);
};

// =====================================================
// VIEW SWITCHING
// =====================================================
const landEl = document.getElementById('land');
const skyEl  = document.getElementById('skyV');
const wBtn   = document.getElementById('wBtn');
const exBtn  = document.getElementById('exBtn');

wBtn.addEventListener('click', () => {
  if (landEl.classList.contains('on')) return;
  skyEl.classList.remove('on');
  landEl.classList.add('on');
  wBtn.classList.add('on');
  exBtn.classList.remove('on');
  setTimeout(() => wInput.focus(), 400);
});

exBtn.addEventListener('click', async () => {
  if (skyEl.classList.contains('on')) return;
  landEl.classList.remove('on');
  skyEl.classList.add('on');
  wBtn.classList.remove('on');
  exBtn.classList.add('on');
  await buildSky();
});

// =====================================================
// BOOT
// =====================================================
const loader = document.getElementById('loader');
resize();

setTimeout(() => {
  loader.classList.add('out');
  setTimeout(() => loader.remove(), 1100);
  landEl.classList.add('on');
  entry();
}, 900);
</script>
